# Akira email theme — the login theme's design language, rebuilt under email
# rendering rules.
#
# parent=base for the same reason the login theme uses it: base ships the
# FreeMarker templates with no styling to fight. Every html/*.ftl in base does
# `<#import "template.ftl">`, and theme resolution finds *this* theme's
# template.ftl first, so overriding that one file re-skins every email.
#
# Note what is NOT shared with login/: none of it. The login theme is a
# stylesheet of CSS custom properties against class names; an email client will
# not load an external stylesheet and most do not support custom properties, so
# the palette below is hardcoded at each use site. The hex values are copied
# from akira.css and have to be changed in both places.
#
# `locales` is deliberately not set — it inherits base's full list. Only
# messages_en.properties is restyled here; other languages fall back to base's
# unstyled bodies inside this theme's styled chrome, which degrades cleanly.
parent=base
