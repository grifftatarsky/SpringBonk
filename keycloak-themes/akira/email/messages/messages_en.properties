# Akira email bodies.
#
# Keycloak's base theme keeps the body of each email in a message key, not in
# the .ftl — html/password-reset.ftl is three lines that hand this string to
# template.ftl. So restyling an email means rewriting its message, and the
# markup has to be inline: a <style> block does not survive Gmail's clipped
# view, and there is no cascade in an email client worth relying on.
#
# ESCAPING — two rules that do not apply to template.ftl:
#   * These strings are run through java.text.MessageFormat. A single quote
#     opens a quoted literal, so every apostrophe is doubled: `didn''t`, and
#     the font stack is `''Segoe UI''` to emit `'Segoe UI'`. Getting this wrong
#     silently swallows the rest of the segment rather than erroring.
#   * `{0}`.. are MessageFormat parameters. The index of each is fixed by the
#     msg(...) call in the matching html/*.ftl in the base theme — they are NOT
#     consistent between keys, so check the .ftl before reordering anything.
#
# Colours are copied from akira.css and repeated at each use site; the dark
# scheme lives in template.ftl and overrides them by class with !important.

emailVerificationBodyHtml=\
