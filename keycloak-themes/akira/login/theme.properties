# Akira login theme.
#
# parent=base, not parent=keycloak: the shipped theme is PatternFly v3 + v4 and
# every element carries a stack of pf- classes with specificity that has to be
# fought rather than styled. base ships the same FreeMarker templates with no
# styling at all and hands every class name over through the kc*Class properties
# below, so this is a plain stylesheet against markup we name ourselves.
#
# The element ids base emits (kc-form-login, kc-page-title, kc-content, ...) are
# part of its template contract and are what the CSS mostly hooks; the classes
# here cover the rest.
parent=base
import=common/keycloak

styles=css/akira.css
scripts=js/theme-sync.js
meta=viewport==width=device-width,initial-scale=1

# Layout
kcHtmlClass=akira-html
kcBodyClass=akira-body
kcLoginClass=akira-login
kcHeaderClass=akira-header
kcHeaderWrapperClass=akira-header__brand
kcFormCardClass=akira-card
kcFormHeaderClass=akira-card__header
kcContentWrapperClass=akira-content

# Form
kcFormClass=akira-form
kcFormGroupClass=akira-field
kcFormGroupErrorClass=akira-field--error
kcLabelClass=akira-label
kcLabelWrapperClass=akira-label-wrap
kcInputClass=akira-input
kcInputWrapperClass=akira-input-wrap
kcInputErrorMessageClass=akira-input-error
kcInputGroup=akira-input-group
kcFormOptionsClass=akira-form-options
kcFormOptionsWrapperClass=akira-form-options__wrap
kcFormButtonsClass=akira-form-buttons
kcFormSettingClass=akira-form-setting
kcCheckboxInputClass=akira-checkbox

# Buttons
kcButtonClass=akira-btn
kcButtonPrimaryClass=akira-btn--primary
kcButtonDefaultClass=akira-btn--default
kcButtonLargeClass=akira-btn--lg
kcButtonBlockClass=akira-btn--block

# Password reveal — base renders an <i>, so the glyph comes from CSS content.
kcFormPasswordVisibilityButtonClass=akira-eye
kcFormPasswordVisibilityIconShow=akira-eye__icon akira-eye__icon--show
kcFormPasswordVisibilityIconHide=akira-eye__icon akira-eye__icon--hide

# Messages
kcFeedbackAreaClass=akira-feedback
kcAlertClass=akira-alert
kcAlertTitleClass=akira-alert__title
kcFeedbackSuccessIcon=akira-alert__icon akira-alert__icon--success
kcFeedbackErrorIcon=akira-alert__icon akira-alert__icon--error
kcFeedbackWarningIcon=akira-alert__icon akira-alert__icon--warning
kcFeedbackInfoIcon=akira-alert__icon akira-alert__icon--info
kcResetFlowIcon=akira-hidden

# Identity providers
kcFormSocialAccountSectionClass=akira-social
kcFormSocialAccountListClass=akira-social__list
kcFormSocialAccountListGridClass=akira-social__list--grid
kcFormSocialAccountListButtonClass=akira-btn akira-btn--default akira-btn--block
kcFormSocialAccountNameClass=akira-social__name
kcFormSocialAccountGridItem=akira-social__item

# Locale switcher
kcLocaleMainClass=akira-locale
kcLocaleWrapperClass=akira-locale__wrap
kcLocaleDropDownClass=akira-locale__dropdown
kcLocaleListClass=akira-locale__list
kcLocaleListItemClass=akira-locale__list-item
kcLocaleItemClass=akira-locale__item
