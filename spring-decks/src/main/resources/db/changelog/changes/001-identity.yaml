databaseChangeLog:
  # ==========================================================================
  # 001 — keycloak_user. Mirrors the thin KeycloakUser entity (id = sub).
  # ==========================================================================
  - changeSet:
      id: 001-keycloak-user-create
      author: decks
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: keycloak_user
      changes:
        - createTable:
            tableName: keycloak_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_seen
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
