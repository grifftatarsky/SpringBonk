              - column: {name: version, valueNumeric: 0}
              - column: {name: name, value: "Thunderwave"}
              - column: {name: level, valueNumeric: 1}
              - column: {name: school, value: "EVOCATION"}
              - column: {name: casting_time, value: "Action"}
              - column: {name: range, value: "Self (15-foot Cube)"}
              - column: {name: duration, value: "Instantaneous"}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "You unleash a wave of thunderous force. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only. In addition, unsecured objects that are fully within the Cube are pushed 10 feet away, and the spell emits a thunderous boom audible out to 300 feet."}
              - column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 1."}
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000007"}
              - column: {name: created_at, valueComputed: "now()"}
              - column: {name: updated_at, valueComputed: "now()"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: name, value: "Detect Magic"}
              - column: {name: level, valueNumeric: 1}
              - column: {name: school, value: "DIVINATION"}
              - column: {name: casting_time, value: "Action or Ritual"}
              - column: {name: range, value: "Self"}
              - column: {name: duration, value: "Concentration, up to 10 minutes"}
              - column: {name: concentration, valueBoolean: true}
              - column: {name: ritual, valueBoolean: true}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the Magic action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell's school of magic. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead."}
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000008"}
              - column: {name: created_at, valueComputed: "now()"}
              - column: {name: updated_at, valueComputed: "now()"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: name, value: "Charm Person"}
              - column: {name: level, valueNumeric: 1}
              - column: {name: school, value: "ENCHANTMENT"}
              - column: {name: casting_time, value: "Action"}
              - column: {name: range, value: "30 feet"}
              - column: {name: duration, value: "1 hour"}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "You attempt to charm a Humanoid you can see within range. It makes a Wisdom saving throw, with Advantage if you or your allies are fighting it. On a failed save, it is Charmed by you until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the creature knows it was Charmed by you."}
              - column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 1. The targets must be within 30 feet of each other when you cast the spell."}
        - insert:
            tableName: spells
            columns:
