databaseChangeLog:
  # ==========================================================================
  # 006 — seed base spells. A representative slice of 5e (2024) spells, loaded
  # as base content (owner_id NULL ⇒ shared + immutable). Runs once, and only
  # if the table is empty, so it never fights user/imported data.
  # ==========================================================================
  - changeSet:
      id: 006-seed-spells
      author: oozengine
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM spells
      changes:
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000001"}
              - column: {name: created_at, valueComputed: "now()"}
              - column: {name: updated_at, valueComputed: "now()"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: name, value: "Fire Bolt"}
              - column: {name: level, valueNumeric: 0}
              - column: {name: school, value: "EVOCATION"}
              - column: {name: casting_time, value: "Action"}
              - column: {name: range, value: "120 feet"}
              - column: {name: duration, value: "Instantaneous"}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "You hurl a mote of fire at a creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Fire damage. A flammable object hit by this spell starts burning if it isn't being worn or carried."}
              - column: {name: at_higher_levels, value: "The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10)."}
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000002"}
              - column: {name: created_at, valueComputed: "now()"}
              - column: {name: updated_at, valueComputed: "now()"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: name, value: "Mage Hand"}
              - column: {name: level, valueNumeric: 0}
              - column: {name: school, value: "CONJURATION"}
              - column: {name: casting_time, value: "Action"}
              - column: {name: range, value: "30 feet"}
              - column: {name: duration, value: "1 minute"}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "A spectral, floating hand appears at a point you choose within range. The hand can manipulate objects, open unlocked doors and containers, stow or retrieve items, and pour out the contents of a container. You can move the hand up to 30 feet each time you use it. The hand can't attack, activate magic items, or carry more than 10 pounds."}
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000003"}
              - column: {name: created_at, valueComputed: "now()"}
              - column: {name: updated_at, valueComputed: "now()"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: name, value: "Eldritch Blast"}
              - column: {name: level, valueNumeric: 0}
              - column: {name: school, value: "EVOCATION"}
              - column: {name: casting_time, value: "Action"}
              - column: {name: range, value: "120 feet"}
              - column: {name: duration, value: "Instantaneous"}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "A beam of crackling energy streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Force damage."}
              - column: {name: at_higher_levels, value: "The spell creates more than one beam at levels 5 (2 beams), 11 (3 beams), and 17 (4 beams). You can direct the beams at the same target or different ones. Make a separate attack roll for each beam."}
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000004"}
              - column: {name: created_at, valueComputed: "now()"}
