              - column: {name: duration, value: "Instantaneous"}
              - column: {name: verbal_component, valueBoolean: true}
              - column: {name: somatic_component, valueBoolean: true}
              - column: {name: description, value: "You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several."}
              - column: {name: at_higher_levels, value: "The spell creates one more dart for each spell slot level above 1."}
        - insert:
            tableName: spells
            columns:
              - column: {name: id, value: "5be1a000-0000-4000-a000-000000000005"}
