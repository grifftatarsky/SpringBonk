databaseChangeLog:
  # ==========================================================================
  # 030 — a feature resolves in ordered steps, not one roll.
  #
  # 027 gave a feature a single delivery: one attack roll or one saving throw.
  # The book chains them. A Ghoul's Claw is an attack and *then*, only on a hit,
  # a Constitution save against paralysis; a Werewolf's Bite is an attack and
  # then a save against the curse. Fourteen creatures work that way, and under
  # the old model their second roll existed only as a sentence — the difference
  # between a werewolf that can infect you and one that just bites.
  #
  # The same pass adds the escalating outcome branches the book uses and 029
  # never modelled: First Failure, Second Failure, Subsequent Failures, Failure
  # by 5 or More. A Cockatrice's bite Restrains on the first failure and
  # Petrifies on the second; both are now rows.
  #
  # 029 is published, so its CSVs are untouched and its feature rows keep their
  # ids. This changeset moves the delivery columns into feature_steps, replaces
  # the effects 029 loaded, and reloads them from db/changelog/data/030/ — with
  # saving-throw coverage going from 187 of the book's 200 clauses to 200.
  # ==========================================================================

  - changeSet:
      id: 030-feature-steps-create
      author: oozengine
      changes:
        - createTable:
            tableName: feature_steps
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: feature_id, type: UUID, constraints: {nullable: false}}
              - column: {name: ordinal, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: step_trigger, type: VARCHAR(24), defaultValue: "ALWAYS", constraints: {nullable: false}}
              - column: {name: target_filter, type: TEXT}
              - column: {name: delivery, type: VARCHAR(20), defaultValue: "AUTOMATIC", constraints: {nullable: false}}
              - column: {name: attack_kind, type: VARCHAR(20)}
              - column: {name: attack_bonus, type: INT}
              - column: {name: attack_bonus_source, type: VARCHAR(24)}
              - column: {name: reach_feet, type: INT}
              - column: {name: range_feet, type: INT}
              - column: {name: range_long_feet, type: INT}
              - column: {name: save_ability, type: VARCHAR(16)}
              - column: {name: save_dc, type: INT}
              - column: {name: save_dc_source, type: VARCHAR(24)}
        - addForeignKeyConstraint:
            constraintName: fk_feature_steps_feature
            baseTableName: feature_steps
            baseColumnNames: feature_id
            referencedTableName: features
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: feature_steps
            indexName: idx_feature_steps_feature
            columns: [{column: {name: feature_id}}, {column: {name: ordinal}}]

  - changeSet:
      id: 030-repoint-effects
      author: oozengine
      # Every effect in the database came from 029 and is reloaded below against
      # its step, so they go rather than being migrated one at a time. The outcome
      # column widens because FAILURE_BY_5_OR_MORE is exactly 20 characters.
      changes:
        - sql:
            sql: DELETE FROM effects
        - dropColumn: {tableName: effects, columns: [{column: {name: feature_id}}]}
        - addColumn:
            tableName: effects
            columns:
              - column: {name: step_id, type: UUID, constraints: {nullable: false}}
        - modifyDataType: {tableName: effects, columnName: outcome, newDataType: VARCHAR(24)}
        - addForeignKeyConstraint:
            constraintName: fk_effects_step
            baseTableName: effects
            baseColumnNames: step_id
            referencedTableName: feature_steps
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex: {tableName: effects, indexName: idx_effects_step, columns: [{column: {name: step_id}}]}

  - changeSet:
      id: 030-drop-feature-delivery-columns
      author: oozengine
      # These describe a roll, and a feature can make more than one.
      changes:
        - dropColumn:
            tableName: features
            columns: [{column: {name: delivery}}, {column: {name: attack_kind}},
                      {column: {name: attack_bonus}}, {column: {name: attack_bonus_source}},
                      {column: {name: save_ability}}, {column: {name: save_dc}},
                      {column: {name: save_dc_source}}, {column: {name: reach_feet}},
                      {column: {name: range_feet}}, {column: {name: range_long_feet}}]

  - changeSet:
      id: 030-load-feature-steps
      author: oozengine
      changes:
        - loadData:
            tableName: feature_steps
            file: db/changelog/data/030/feature-steps.csv
            relativeToChangelogFile: false
            usePreparedStatements: true
            columns:
              - column: {name: id, type: UUID}
              - column: {name: created_at, type: DATE}
              - column: {name: updated_at, type: DATE}
              - column: {name: version, type: NUMERIC}
              - column: {name: feature_id, type: UUID}
              - column: {name: ordinal, type: NUMERIC}
              - column: {name: step_trigger, type: STRING}
              - column: {name: target_filter, type: STRING}
              - column: {name: delivery, type: STRING}
              - column: {name: attack_kind, type: STRING}
              - column: {name: attack_bonus, type: NUMERIC}
              - column: {name: attack_bonus_source, type: STRING}
              - column: {name: reach_feet, type: NUMERIC}
              - column: {name: range_feet, type: NUMERIC}
              - column: {name: range_long_feet, type: NUMERIC}
              - column: {name: save_ability, type: STRING}
              - column: {name: save_dc, type: NUMERIC}
              - column: {name: save_dc_source, type: STRING}

  - changeSet:
      id: 030-load-effects
      author: oozengine
      changes:
        - loadData:
            tableName: effects
            file: db/changelog/data/030/effects.csv
            relativeToChangelogFile: false
            usePreparedStatements: true
            columns:
              - column: {name: id, type: UUID}
              - column: {name: created_at, type: DATE}
              - column: {name: updated_at, type: DATE}
              - column: {name: version, type: NUMERIC}
              - column: {name: step_id, type: UUID}
              - column: {name: outcome, type: STRING}
              - column: {name: kind, type: STRING}
              - column: {name: ordinal, type: NUMERIC}
              - column: {name: dice_count, type: NUMERIC}
              - column: {name: dice_faces, type: NUMERIC}
              - column: {name: dice_bonus, type: NUMERIC}
              - column: {name: dice_average, type: NUMERIC}
              - column: {name: damage_type, type: STRING}
              - column: {name: half_damage, type: BOOLEAN}
              - column: {name: condition_id, type: UUID}
              - column: {name: escape_dc, type: NUMERIC}
              - column: {name: notes, type: STRING}
