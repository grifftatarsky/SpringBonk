databaseChangeLog:
  # ==========================================================================
  # 011 — reference content tables: feats, conditions, weapon_masteries,
  # glossary_entries. Each is CatalogContent (owner_id, overrides_id self-FK)
  # so the shared override/permission logic applies uniformly. Kept as distinct
  # per-domain tables (rather than one polymorphic "reference" table) so they
  # can diverge and map 1:1 to the API + finder folders.
  # ==========================================================================
  - changeSet:
      id: 011-feats-create
      author: oozengine
      preConditions: {onFail: MARK_RAN, not: {tableExists: {tableName: feats}}}
      changes:
        - createTable:
            tableName: feats
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: owner_id, type: UUID}
              - column: {name: overrides_id, type: UUID}
              - column: {name: name, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: feat_category, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: prerequisite, type: VARCHAR(255)}
              - column: {name: description, type: TEXT, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_feats_overrides
            baseTableName: feats
            baseColumnNames: overrides_id
            referencedTableName: feats
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex: {tableName: feats, indexName: idx_feats_owner, columns: [{column: {name: owner_id}}]}
        - createIndex: {tableName: feats, indexName: idx_feats_name, columns: [{column: {name: name}}]}

