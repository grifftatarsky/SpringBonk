        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Gentle Repose"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "10 days"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "salt and a copper coin for each eye"}}, {column: {name: description, value: "A corpse you touch is protected from decay and can't become Undead for the duration. The spell also extends the time limit on raising the target from the dead, since days under its effect don't count against that limit."}}]}
