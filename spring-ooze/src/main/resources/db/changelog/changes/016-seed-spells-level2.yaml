databaseChangeLog:
  # ==========================================================================
  # 016 — SRD spell import, level 2. Excludes level-2 spells already in 006
  # (Misty Step, Invisibility). Stats are facts; descriptions are our own
  # wording. Spells reworked in 2024 where I wasn't certain of the new text
  # (Barkskin, Spiritual Weapon, Magic Weapon, Ray of Enfeeblement) are left
  # for a verified pass rather than guessed.
  # ==========================================================================
  - changeSet:
      id: 016-seed-spells-level2
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Aid"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a strip of white cloth"}}, {column: {name: description, value: "Bolster up to three creatures. Each target's Hit Point maximum and current Hit Points increase by 5 for the duration."}}, {column: {name: at_higher_levels, value: "The Hit Points increase by 5 for each spell slot level above 2."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Alter Self"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Transform yourself in one of three ways for the duration: adapt to breathe water and swim, alter your appearance, or grow natural weapons that count as magical and deal 1d6 damage."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Augury"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "specially marked sticks or bones"}}, {column: {name: description, value: "Consult an otherworldly entity about a specific course of action you plan to take within the next 30 minutes. The omen returned is Weal (good), Woe (bad), Weal and Woe, or nothing."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Blindness/Deafness"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "A creature you can see makes a Constitution saving throw or gains the Blinded or Deafened condition (your choice) for the duration, repeating the save at the end of each of its turns."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 2."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Blur"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Your form becomes blurred and shifting. For the duration, any creature has Disadvantage on attack rolls against you unless it can see by means other than ordinary sight, such as Blindsight or Truesight."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Calm Emotions"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Each Humanoid in a 20-foot-radius Sphere makes a Charisma saving throw. On a failure you can either suppress the Charmed and Frightened conditions on it or make it indifferent toward creatures of your choice, until the spell ends."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Continual Flame"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "ruby dust worth 50+ GP, consumed"}}, {column: {name: description, value: "A flame springs from an object you touch, shedding light like a torch. The flame is heatless, can't be extinguished by wind or water, and burns until dispelled."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Darkness"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "bat fur and a drop of pitch or coal"}}, {column: {name: description, value: "Magical darkness fills a 15-foot-radius Sphere, spreading around corners. Nonmagical light and Darkvision can't illuminate it. If cast on an object, the darkness moves with it and can be smothered by covering the object."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Darkvision"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "dried carrot or agate"}}, {column: {name: description, value: "A willing creature you touch gains Darkvision out to a range of 60 feet for the duration."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Detect Thoughts"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a copper coin"}}, {column: {name: description, value: "Read the surface thoughts of a creature within 30 feet. You can probe deeper into a mind, but the target then makes a Wisdom saving throw to notice you and end the effect."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Enhance Ability"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "fur or a feather from a beast"}}, {column: {name: description, value: "Touch a creature to grant it Advantage on ability checks using one ability score of your choice for the duration. Boosting Strength or Constitution adds further benefits, such as advantage on Strength checks or temporary Hit Points."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 2."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1d000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Enlarge/Reduce"}}, {column: {name: level, valueNumeric: 2}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of powdered iron"}}, {column: {name: description, value: "Make a creature or object larger or smaller (one size category) for the duration. Enlarging grants Advantage on Strength checks and saves and +1d4 weapon damage; reducing imposes Disadvantage and -1d4 weapon damage."}}]}
