databaseChangeLog:
  # ==========================================================================
  # 002 — vocations. Mirrors the Vocation JPA entity (extends BaseEntity).
  # ==========================================================================
  - changeSet:
      id: 002-vocations-create
      author: oozengine
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vocations
      changes:
        - createTable:
            tableName: vocations
            columns:
              # BaseEntity columns
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # Basic info
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: likes
                  type: VARCHAR(255)
              - column:
                  name: primary_ability
                  type: VARCHAR(255)
              - column:
                  name: complexity
                  type: VARCHAR(255)
        - createIndex:
            tableName: vocations
            indexName: idx_vocations_name
            columns:
              - column:
                  name: name
