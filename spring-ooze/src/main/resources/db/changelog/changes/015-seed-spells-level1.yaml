databaseChangeLog:
  # ==========================================================================
  # 015 — SRD spell import, level 1. Excludes the level-1 spells already in 006
  # (Magic Missile, Shield, Thunderwave, Detect Magic, Charm Person). Stats are
  # facts; descriptions are our own wording. A few level-1 spells reworked in
  # 2024 (Sleep, Color Spray, Inflict Wounds) are intentionally left for a
  # verified pass rather than guessed.
  # ==========================================================================
  - changeSet:
      id: 015-seed-spells-level1
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Alarm"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bell and silver wire"}}, {column: {name: description, value: "Ward a door, window, or area up to a 20-foot cube. For the duration you're alerted — audibly or with a silent mental ping — whenever a creature of your choosing touches or enters the warded area."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Animal Friendship"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a morsel of food"}}, {column: {name: description, value: "A Beast you can see makes a Wisdom saving throw or has the Charmed condition toward you for the duration. It fails automatically if its Intelligence is 3 or lower."}}, {column: {name: at_higher_levels, value: "You can target one additional Beast for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Bane"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a drop of blood"}}, {column: {name: description, value: "Up to three creatures of your choice make a Charisma saving throw. On a failure, a target subtracts 1d4 from its attack rolls and saving throws until the spell ends."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Bless"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a Holy Symbol"}}, {column: {name: description, value: "Bless up to three creatures of your choice. Until the spell ends, a blessed creature adds 1d4 to each of its attack rolls and saving throws."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Burning Hands"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self (15-foot Cone)"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A thin sheet of flame fans out. Each creature in a 15-foot Cone makes a Dexterity saving throw, taking 3d6 Fire damage on a failure or half as much on a success. Unattended flammable objects in the area ignite."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d6 for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Command"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Speak a one-word command to a creature you can see. It makes a Wisdom saving throw or follows the command on its next turn — typically Approach, Drop, Flee, Grovel (fall Prone), or Halt."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Comprehend Languages"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of soot and salt"}}, {column: {name: description, value: "For the duration you understand the literal meaning of any language you hear or see written, reading about a page of text per minute."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Cure Wounds"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A creature you touch regains Hit Points equal to 2d8 plus your spellcasting ability modifier. This spell has no effect on Undead or Constructs."}}, {column: {name: at_higher_levels, value: "The healing increases by 2d8 for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Detect Evil and Good"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "For the duration you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet, as well as any consecrated or desecrated place or object."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1c000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Disguise Self"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Make yourself — including clothing, armor, and gear — look different until the spell ends. The change is illusory; physical interaction or an Investigation check against your spell save DC reveals the disguise."}}]}
