databaseChangeLog:
  # ==========================================================================
  # 018 — SRD spell import, level 4. Stats are facts; descriptions are our own
  # wording. The 2024-reworked conjure spells (Conjure Minor Elementals,
  # Conjure Woodland Beings, Giant Insect) and Otiluke's Resilient Sphere are
  # left for a verified pass rather than guessed.
  # ==========================================================================
  - changeSet:
      id: 018-seed-spells-level4
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Arcane Eye"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of bat fur"}}, {column: {name: description, value: "Create an invisible, floating eye that you see through. It has Darkvision out to 30 feet, can fly 30 feet on your turn, and slips through openings as small as 1 inch, letting you scout ahead."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Banishment"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "an item distasteful to the target"}}, {column: {name: description, value: "A creature you can see makes a Charisma saving throw or is banished to a harmless demiplane, where it is Incapacitated. If it is native to a different plane and the spell lasts the full minute, it stays there permanently; otherwise it returns when the spell ends."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 4."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Black Tentacles"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a piece of tentacle from a giant octopus or squid"}}, {column: {name: description, value: "Writhing tentacles fill a 20-foot square, making it Difficult Terrain. A creature there when the spell is cast, or that enters it, makes a Dexterity saving throw or takes 3d6 Bludgeoning damage and is Restrained; a Restrained creature takes 3d6 again at the start of each of its turns."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Blight"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Drain the life from a creature within range. It makes a Constitution saving throw, taking 8d8 Necrotic damage on a failure or half as much on a success. Undead and Constructs are unaffected; a plant creature has Disadvantage and takes maximum damage."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 4."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Confusion"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "three nutshells"}}, {column: {name: description, value: "Each creature in a 10-foot-radius Sphere makes a Wisdom saving throw or is afflicted with madness. An affected creature can't take Reactions and, each turn, rolls to determine whether it babbles, moves randomly, attacks at random, or acts normally. It repeats the save each turn."}}, {column: {name: at_higher_levels, value: "The Sphere's radius increases by 5 feet for each spell slot level above 4."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Control Water"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "300 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a drop of water and a pinch of dust"}}, {column: {name: description, value: "Manipulate a large body of water in a 100-foot cube. Choose one effect: raise a flood, part the water to make a trench, redirect its flow, or churn a whirlpool that drags creatures down. You can change the effect on later turns."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Death Ward"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Ward a creature you touch against death. The first time it would drop to 0 Hit Points before the spell ends, it drops to 1 instead; the first effect that would kill it outright simply fails. Either way, the spell is then expended."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dimension Door"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "500 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Teleport yourself to any spot within range that you can see, visualize, or describe by distance and direction. You can bring one willing creature within 5 feet of you; if either of you would arrive in an occupied space, you take 4d6 Force damage and the teleport fails."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Divination"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "incense worth 25+ GP, consumed"}}, {column: {name: description, value: "Contact a god or its servants to gain a truthful reply — a short phrase, omen, or cryptic rhyme — about a specific goal, event, or activity to occur within the next seven days. Casting it more than once a day risks a false answer."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dominate Beast"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A Beast you can see makes a Wisdom saving throw or is Charmed and under your control for the duration. You can issue commands, and once each turn take an action through it; each time it takes damage it repeats the save."}}, {column: {name: at_higher_levels, value: "The duration grows to Concentration up to 10 minutes (level 5), 1 hour (level 6), or 8 hours (level 7+)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Fabricate"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Convert raw materials into finished products of the same substance — turning wood into a bridge, cloth into clothes, or ore into ingots. The size you can affect is limited, and crafting items that require fine skill calls for relevant tool proficiency."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Fire Shield"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "10 minutes"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of phosphorus or a firefly"}}, {column: {name: description, value: "Flames wreathe you, shedding light. Choose a warm shield (Resistance to Cold) or a chill shield (Resistance to Fire). Whenever a creature within 5 feet hits you with a melee attack, it takes 2d8 Fire or Cold damage, matching your shield."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Freedom of Movement"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a leather strap"}}, {column: {name: description, value: "A willing creature you touch moves freely for the duration: Difficult Terrain costs it no extra movement, magic can't reduce its Speed or impose the Restrained or Paralyzed conditions, and it can spend 5 feet of movement to escape nonmagical restraints. It can also move and attack normally while underwater."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Greater Invisibility"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A creature you touch gains the Invisible condition until the spell ends. Unlike lesser invisibility, attacking or casting spells doesn't end it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Guardian of Faith"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "A Large spectral guardian appears and hovers in an unoccupied space. An enemy that first enters a space within 10 feet of it makes a Dexterity saving throw, taking 20 Radiant damage on a failure or half on a success. The guardian fades once it has dealt a total of 60 damage."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hallucinatory Terrain"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "300 feet"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a stone, a twig, and a bit of greenery"}}, {column: {name: description, value: "Disguise the natural terrain in a 150-foot cube to look, sound, and smell like another kind of terrain — making open fields seem a swamp, a road a meadow, and so on. Physical structures aren't hidden, and touching a feature lets a creature discern the illusion."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Ice Storm"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "300 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of dust and a few drops of water"}}, {column: {name: description, value: "Hail batters a 20-foot-radius, 40-foot-tall cylinder. Each creature there makes a Dexterity saving throw, taking 2d8 Bludgeoning plus 4d6 Cold damage on a failure or half as much on a success. The hail then turns the ground into Difficult Terrain until your next turn."}}, {column: {name: at_higher_levels, value: "The Bludgeoning damage increases by 1d8 for each spell slot level above 4."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000012"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Locate Creature"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of fur from a bloodhound"}}, {column: {name: description, value: "Sense the direction to a creature you're familiar with, or to the nearest creature of a specific kind, as long as it's within 1,000 feet. Running water at least 10 feet wide blocks the spell, as does masking the target with Nondetection."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000013"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Phantasmal Killer"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Tear an illusory image of a creature's worst fear from its mind, visible only to it. It makes a Wisdom saving throw or becomes Frightened and takes 4d10 Psychic damage; while Frightened it repeats the save each turn, taking the damage again on a failure."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d10 for each spell slot level above 4."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000014"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Polymorph"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a caterpillar cocoon"}}, {column: {name: description, value: "Transform a creature you can see into a Beast whose Challenge Rating is no higher than the target's level or CR. An unwilling target makes a Wisdom saving throw to resist. It gains the Beast's statistics and a separate pool of Hit Points, reverting when the spell ends or those Hit Points run out."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000015"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Stone Shape"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "soft clay shaped into the desired form"}}, {column: {name: description, value: "Reshape a stone object or section no larger than 5 feet in any dimension into whatever rough form you like — a weapon, a door, a passage, or simple containers and shapes. Fine detail isn't possible."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000016"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Stoneskin"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "diamond dust worth 100+ GP, consumed"}}, {column: {name: description, value: "A willing creature you touch turns stony and resilient, gaining Resistance to nonmagical Bludgeoning, Piercing, and Slashing damage for the duration."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1f000-0000-4000-a000-000000000017"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Wall of Fire"}}, {column: {name: level, valueNumeric: 4}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a small piece of phosphorus"}}, {column: {name: description, value: "Raise a wall of flame up to 60 feet long, 20 feet high, and 1 foot thick (or a ring 20 feet in diameter). One side, chosen by you, deals 5d8 Fire damage to creatures within 10 feet; both sides burn a creature that enters the wall or ends its turn there (Dexterity save for half)."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 4."}}]}
