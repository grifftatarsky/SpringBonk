databaseChangeLog:
  # ==========================================================================
  # 014 — full SRD spell import (begins here). Adds spells NOT already in 006
  # (Fire Bolt, Mage Hand, Eldritch Blast, Magic Missile, Shield, Thunderwave,
  # Detect Magic, Charm Person, Misty Step, Invisibility, Fireball, Counterspell
  # live there). This changeset: the cantrips. Leveled spells follow in further
  # changesets/files. Stats are facts; descriptions are our own wording.
  # ==========================================================================
  - changeSet:
      id: 014-seed-spells-cantrips
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dancing Lights"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of phosphorus or a glowworm"}}, {column: {name: description, value: "Create up to four torch-sized lights (or merge them into one vaguely humanoid glow) that hover within range, shedding dim light, and move them about on your turns."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Druidcraft"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Produce a small nature effect: forecast the next day's weather, make a flower bloom, create a harmless sensory effect, or light or snuff a small flame."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Guidance"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Touch a willing creature. Once before the spell ends, it can roll a d4 and add the result to one ability check of its choice."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Light"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a firefly or phosphorescent moss"}}, {column: {name: description, value: "An object you touch sheds bright light in a 20-foot radius and dim light for an additional 20 feet. If you target an object held by an unwilling creature, it can make a Dexterity saving throw to avoid the spell."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mending"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "two lodestones"}}, {column: {name: description, value: "Repair a single break or tear in an object you touch, as long as the damage is no larger than a foot in any dimension. It restores no magical properties."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Message"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "1 round"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a short piece of copper wire"}}, {column: {name: description, value: "Whisper a message to a creature within range that only it can hear. It can whisper a reply that only you can hear."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Minor Illusion"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of fleece"}}, {column: {name: description, value: "Create either a sound or a static visual image no larger than a 5-foot cube. A creature that studies it can use an action and an Investigation check to discern that it's an illusion."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Prestidigitation"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "Up to 1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A minor magical trick: create a harmless sensory effect, light or snuff a small flame, clean or soil an object, chill, warm, or flavor food, or conjure a trifling trinket or mark."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Produce Flame"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self / 30 feet"}}, {column: {name: duration, value: "10 minutes"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A flickering flame in your hand sheds light and lasts for the duration. You can hurl it at a target within 30 feet as a ranged spell attack, dealing 1d8 Fire damage on a hit and ending the spell."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 when you reach levels 5, 11, and 17."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Ray of Frost"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A frigid beam streaks toward a creature within range. Make a ranged spell attack; on a hit it takes 1d8 Cold damage and its Speed is reduced by 10 feet until the start of your next turn."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 when you reach levels 5, 11, and 17."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Resistance"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Touch a willing creature. Once before the spell ends, it can roll a d4 and add the result to one saving throw of its choice."}}]}
