        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1b000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Shillelagh"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Bonus Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "mistletoe"}}, {column: {name: description, value: "Wreathe a Club or Quarterstaff you hold in nature's power. For the duration you can use your spellcasting ability for its attacks, it deals a d8 of damage, and it counts as magical."}}]}
