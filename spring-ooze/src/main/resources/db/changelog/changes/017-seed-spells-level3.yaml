databaseChangeLog:
  # ==========================================================================
  # 017 — SRD spell import, level 3. Excludes level-3 spells already in 006
  # (Fireball, Counterspell). Stats are facts; descriptions are our own
  # wording. Conjure Animals and Mass Healing Word were reworked/rescaled in
  # 2024 and are left for a verified pass rather than guessed.
  # ==========================================================================
  - changeSet:
      id: 017-seed-spells-level3
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Animate Dead"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a drop of blood, a scrap of flesh, and bone dust"}}, {column: {name: description, value: "Animate a pile of bones or a corpse into an undead Skeleton or Zombie under your control. You can issue it commands, and you must recast the spell within a set time to keep controlling it, raising additional or further undead as you do."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Beacon of Hope"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Bless any number of creatures within range. For the duration, each has Advantage on Wisdom saving throws and Death Saving Throws, and regains the maximum possible Hit Points from any healing."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Bestow Curse"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Touch a creature, which makes a Wisdom saving throw or is cursed. Choose a drawback such as Disadvantage on a chosen ability, Disadvantage on attacks against you, a chance to lose its turn, or +1d8 Necrotic damage from your attacks."}}, {column: {name: at_higher_levels, value: "Casting at level 4 makes it last 10 minutes (no Concentration), level 5+ longer, up to permanent at level 9."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Blink"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "At the end of each of your turns, roll a d6. On a 4 or higher you briefly vanish to the Ethereal Plane, becoming untouchable, then reappear in an empty space within 10 feet at the start of your next turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Call Lightning"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A storm cloud forms overhead. When you cast the spell, and as an action on later turns, you call a bolt down on a point you can see; each creature within 5 feet makes a Dexterity saving throw for 3d10 Lightning damage (half on a success)."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d10 for each spell slot level above 3."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Clairvoyance"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "1 mile"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a focus worth 100+ GP — a jeweled horn for hearing or a glass eye for seeing"}}, {column: {name: description, value: "Create an invisible sensor at a location you're familiar with or can describe. Through it you can either see or hear (your choice) as if present, and you can switch between the two on your turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Create Food and Water"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Conjure 45 pounds of plain food and 30 gallons of water — enough to sustain up to fifteen people for a day. The food spoils after 24 hours if uneaten."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Daylight"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A 60-foot-radius Sphere of bright light (and dim light for another 60 feet) shines from a point or object you choose. It counts as sunlight and dispels any magical darkness of a lower level in its area."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dispel Magic"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "End spells on a creature, object, or area. Any spell of level 3 or lower ends automatically; for a higher-level spell, make an ability check using your spellcasting ability against a DC of 10 plus that spell's level."}}, {column: {name: at_higher_levels, value: "You automatically end spells of a level equal to or below the slot used."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Fear"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self (30-foot Cone)"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a white feather or a hen's heart"}}, {column: {name: description, value: "Each creature in a 30-foot Cone makes a Wisdom saving throw or drops what it's holding and gains the Frightened condition. A Frightened creature must Dash away from you each turn, repeating the save (with Advantage if it can't see you) to end the effect."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Feign Death"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of graveyard dirt"}}, {column: {name: description, value: "A willing creature you touch falls into a deathlike trance, appearing dead to inspection and to spells. It is Blinded and Incapacitated, has Resistance to all damage but Psychic, and is immune to disease for the duration."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Fly"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a feather from a bird's wing"}}, {column: {name: description, value: "A willing creature you touch gains a Fly Speed of 60 feet for the duration. If the spell ends while the creature is aloft, it falls unless it can stop the descent."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 3."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Gaseous Form"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of gauze and a wisp of smoke"}}, {column: {name: description, value: "A willing creature and its gear become a misty cloud. It gains a Fly Speed of 10 feet, can pass through narrow gaps, has Resistance to nonmagical damage and Advantage on Strength, Dexterity, and Constitution saves, but can't attack, cast spells, or manipulate objects."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Glyph of Warding"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled or triggered"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "incense and powdered diamond worth 200+ GP, consumed"}}, {column: {name: description, value: "Inscribe a glyph on a surface or within an object that triggers when a condition you set is met. Choose an explosive rune (up to 5d8 damage of a type you pick, Dexterity save for half) or a stored spell of level 3 or lower that's cast when triggered."}}, {column: {name: at_higher_levels, value: "Explosive damage increases by 1d8, and a stored spell can be one level lower than the slot used."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Haste"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a shaving of licorice root"}}, {column: {name: description, value: "A willing creature gains +2 AC, Advantage on Dexterity saves, doubled Speed, and an extra limited action each turn (used to Attack once, Dash, Disengage, Hide, or Utilize). When the spell ends, it can't move or act until the end of its next turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hypnotic Pattern"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a glowing stick of incense or a crystal vial of colored sand"}}, {column: {name: description, value: "A twisting pattern of colors appears in a 30-foot cube. Each creature there that can see it makes a Wisdom saving throw or becomes Charmed and Incapacitated, with a Speed of 0, until the spell ends; taking damage or being shaken by an ally ends it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Lightning Bolt"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self (100-foot Line)"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of fur and a glass rod"}}, {column: {name: description, value: "A stroke of lightning 100 feet long and 5 feet wide arcs from you. Each creature in the line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failure or half as much on a success."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d6 for each spell slot level above 3."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000012"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Magic Circle"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "salt and powdered silver worth 100+ GP, consumed"}}, {column: {name: description, value: "Create a 10-foot-radius, 20-foot-tall cylinder warded against a creature type you choose (such as Fiends or Undead). Those creatures can't willingly enter or affect anyone inside by attack, and have Disadvantage on attacks against those within; you can instead invert it to trap such a creature."}}, {column: {name: at_higher_levels, value: "The duration increases by 1 hour for each spell slot level above 3."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000013"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Major Image"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a bit of fleece"}}, {column: {name: description, value: "Create the image of an object, creature, or other visible phenomenon no larger than a 20-foot cube, complete with sounds, smells, and temperature. You can move it and change it with your action; physical interaction or an Investigation check reveals it as an illusion."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000014"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Meld into Stone"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Step into a stone object or surface large enough to hold you, merging with it along with your gear. You can sense and step out again, but you're effectively hidden, with Disadvantage on Perception, and take damage if the stone is destroyed."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000015"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Nondetection"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of diamond dust worth 25+ GP, consumed"}}, {column: {name: description, value: "Hide a willing creature, place, or object no larger than 10 feet from divination magic for the duration. The target can't be detected, targeted, or perceived through scrying sensors or Divination spells."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000016"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Phantom Steed"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Conjure a quasi-real, horselike steed with a Speed of 100 feet that one creature can ride. It can travel about 10 miles in an hour and vanishes if it takes any damage, dropping its rider."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be1e000-0000-4000-a000-000000000017"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Plant Growth"}}, {column: {name: level, valueNumeric: 3}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action or 8 hours"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Channel vitality into plants. The quick version overgrows a 100-foot radius into Difficult Terrain that costs extra movement; the 8-hour version enriches a half-mile of land so crops yield twice as much for a year."}}]}
