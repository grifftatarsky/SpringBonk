databaseChangeLog:
  # ==========================================================================
  # 001 — spells. Mirrors the Spell JPA entity (extends BaseEntity).
  # ==========================================================================
  - changeSet:
      id: 001-spells-create
      author: oozengine
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: spells
      changes:
        - createTable:
            tableName: spells
            columns:
              # BaseEntity columns
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # Basic info
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: level
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: school
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              # Casting
              - column:
                  name: casting_time
                  type: VARCHAR(255)
              - column:
                  name: range
                  type: VARCHAR(255)
              - column:
                  name: duration
                  type: VARCHAR(255)
              - column:
                  name: concentration
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: ritual
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Components
              - column:
                  name: verbal_component
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: somatic_component
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: material_component
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: materials
                  type: TEXT
              # Descriptions
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: at_higher_levels
                  type: TEXT
        - createIndex:
            tableName: spells
            indexName: idx_spells_name
            columns:
              - column:
                  name: name
        - createIndex:
            tableName: spells
            indexName: idx_spells_level
            columns:
              - column:
                  name: level
        - createIndex:
            tableName: spells
            indexName: idx_spells_school
            columns:
              - column:
                  name: school
