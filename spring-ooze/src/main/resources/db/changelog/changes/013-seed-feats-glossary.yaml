databaseChangeLog:
  # ==========================================================================
  # 013 — the rest of the feats (General, Fighting Style, Epic Boon) and more
  # glossary terms. Appends to the tables seeded in 012 (no count check — the
  # changeset id makes it run once). Stats are facts; descriptions are ours.
  # ==========================================================================
  - changeSet:
      id: 013-seed-feats-more
      author: oozengine
      changes:
        # --- General feats (Level 4+) ---
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Ability Score Improvement"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+"}}, {column: {name: description, value: "Increase one ability score by 2, or two scores by 1 each, up to a maximum of 20. You can take this feat more than once."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Actor"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Charisma 13+"}}, {column: {name: description, value: "+1 Charisma (max 20). Advantage on Deception and Performance checks to pass yourself off as another person, and you can mimic sounds or voices you've heard."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Athlete"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength or Dexterity 13+"}}, {column: {name: description, value: "+1 Strength or Dexterity (max 20). Standing from Prone costs only 5 feet of movement, climbing isn't Difficult Terrain, and you can make a running jump after moving just 5 feet."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Charger"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength or Dexterity 13+"}}, {column: {name: description, value: "+1 Strength or Dexterity (max 20). After you take the Dash action, you can make one melee attack or shove as a Bonus Action, with a bonus if you moved at least 10 feet in a straight line."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Crossbow Expert"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Dexterity 13+"}}, {column: {name: description, value: "+1 Dexterity (max 20). Ignore the Loading property of crossbows you're proficient with, and being within 5 feet of an enemy doesn't impose Disadvantage on your ranged attacks."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Defensive Duelist"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Dexterity 13+"}}, {column: {name: description, value: "+1 Dexterity (max 20). When hit by a melee attack while holding a Finesse weapon, you can add your Proficiency Bonus to your AC against that attack (Reaction)."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dual Wielder"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Dexterity 13+"}}, {column: {name: description, value: "+1 Strength or Dexterity (max 20). Gain +1 AC while wielding a melee weapon in each hand, use non-Light weapons for two-weapon fighting, and draw or stow two one-handed weapons at once."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000012"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Durable"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Constitution 13+"}}, {column: {name: description, value: "+1 Constitution (max 20). When you roll Hit Dice to regain Hit Points, treat any roll below your Constitution modifier as that modifier, and you have Advantage on Death Saving Throws."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000013"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Great Weapon Master"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength 13+"}}, {column: {name: description, value: "+1 Strength (max 20). Once per turn, a hit with a Heavy weapon deals extra damage equal to your Proficiency Bonus, and scoring a Critical Hit or dropping a creature to 0 Hit Points with a Heavy weapon lets you make a melee attack as a Bonus Action."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000014"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Heavy Armor Master"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength 13+, Heavy armor proficiency"}}, {column: {name: description, value: "+1 Strength (max 20). While wearing Heavy armor, reduce the Bludgeoning, Piercing, and Slashing damage you take from nonmagical attacks."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000015"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Inspiring Leader"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Wisdom or Charisma 13+"}}, {column: {name: description, value: "+1 Wisdom or Charisma (max 20). Spend a short time encouraging your allies to grant them Temporary Hit Points."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000016"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Polearm Master"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength or Dexterity 13+"}}, {column: {name: description, value: "+1 Strength or Dexterity (max 20). Make a Bonus Action attack with the opposite end of a Glaive, Halberd, Pike, Quarterstaff, or Spear, and creatures provoke an Opportunity Attack when they enter the weapon's reach."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000017"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Resilient"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+"}}, {column: {name: description, value: "Increase one ability score of your choice by 1 (max 20) and gain saving-throw proficiency with that ability."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000018"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Sentinel"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength or Dexterity 13+"}}, {column: {name: description, value: "+1 Strength or Dexterity (max 20). A creature you hit with an Opportunity Attack has its Speed reduced to 0 for the turn, creatures provoke Opportunity Attacks even when they Disengage, and you can react to attack a creature that attacks an ally near you."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000019"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Sharpshooter"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Dexterity 13+"}}, {column: {name: description, value: "+1 Dexterity (max 20). Your ranged weapon attacks ignore Half and Three-Quarters Cover, attacking at long range doesn't impose Disadvantage, and being within 5 feet of an enemy doesn't impose Disadvantage on your ranged attacks."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000001a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Shield Master"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Strength 13+"}}, {column: {name: description, value: "+1 Strength (max 20). Shove with your Shield as a Bonus Action, add your Shield's bonus to Dexterity saving throws against effects that target only you, and take no damage on some successful Dexterity saves while holding a Shield."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000001b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Skill Expert"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+"}}, {column: {name: description, value: "+1 to an ability score of your choice (max 20). Gain proficiency in one skill and Expertise in one skill you're already proficient with."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000001c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Speedy"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, Dexterity 13+"}}, {column: {name: description, value: "+1 Dexterity (max 20). Your Speed increases by 10 feet, you can Dash through Difficult Terrain without extra cost, and Opportunity Attacks have Disadvantage against you."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000001d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "War Caster"}}, {column: {name: feat_category, value: "General"}}, {column: {name: prerequisite, value: "Level 4+, spellcasting or Pact Magic"}}, {column: {name: description, value: "+1 Intelligence, Wisdom, or Charisma (max 20). Advantage on Constitution saves to maintain Concentration, perform somatic components with your hands full, and cast a spell as an Opportunity Attack instead of making a melee attack."}}]}
        # --- Fighting Style feats ---
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000001e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Archery"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "You gain a +2 bonus to attack rolls you make with Ranged weapons."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000001f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Blind Fighting"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "You have Blindsight out to 10 feet, letting you see anything in that range that isn't behind Total Cover even while Blinded or in Darkness."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000020"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Defense"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "While you are wearing armor, you gain a +1 bonus to your Armor Class."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000021"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dueling"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "When you wield a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000022"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Great Weapon Fighting"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "When you roll damage for a two-handed or versatile melee weapon held in two hands, treat any 1 or 2 on a damage die as a 3."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000023"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Interception"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "When a creature you can see hits another creature within 5 feet of you with an attack, you can reduce the damage by 1d10 plus your Proficiency Bonus (Reaction), if you're holding a weapon or Shield."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000024"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Protection"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "When a creature you can see attacks a target other than you within 5 feet, you can impose Disadvantage on that attack roll (Reaction) if you're holding a Shield."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000025"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Thrown Weapon Fighting"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "You can draw a weapon that has the Thrown property as part of the attack you make with it, and you gain a +2 bonus to damage rolls with Thrown weapons."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000026"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Two-Weapon Fighting"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "When you make the extra attack of two-weapon fighting, you can add your ability modifier to that attack's damage."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000027"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Unarmed Fighting"}}, {column: {name: feat_category, value: "Fighting Style"}}, {column: {name: prerequisite, value: "Fighting Style feature"}}, {column: {name: description, value: "Your Unarmed Strikes deal more damage (a d6, or a d8 if you have no weapon or Shield in either hand), and you deal damage to a creature you have Grappled at the start of each of your turns."}}]}
        # --- Epic Boons (Level 19+) ---
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000028"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Combat Prowess"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). Once per turn, when you miss with an attack roll, you can choose to hit instead (not a Critical Hit)."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000029"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Dimensional Travel"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). After you take the Attack or Magic action, you can teleport up to 30 feet to a space you can see."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000002a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Energy Resistance"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). Gain Resistance to two damage types of your choice, and once per turn you can deal extra damage of one of those types when you hit with an attack."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000002b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Fate"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). When a creature within 60 feet makes a d20 Test, you can roll a d10 and apply it as a bonus or penalty to the roll, a limited number of times per Long Rest."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000002c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Fortitude"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). Your Hit Point maximum increases by 40, and when you spend Hit Dice to regain Hit Points, you regain extra Hit Points."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000002d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Irresistible Offense"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to Strength or Dexterity (max 30). Your Bludgeoning, Piercing, and Slashing damage ignores Resistance, and on a natural 20 on an attack roll you add your Strength or Dexterity score as extra damage."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000002e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Skill"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). Gain proficiency in all skills, and gain Expertise in one skill of your choice."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-00000000002f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Speed"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). Your Speed increases by 30 feet, and when you take the Dash action you are immune to Opportunity Attacks until the end of the turn."}}]}
        - insert: {tableName: feats, columns: [{column: {name: id, value: "fea70000-0000-4000-a000-000000000030"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Boon of Truesight"}}, {column: {name: feat_category, value: "Epic Boon"}}, {column: {name: prerequisite, value: "Level 19+"}}, {column: {name: description, value: "+1 to an ability score (max 30). You have Truesight out to a range of 60 feet."}}]}

  - changeSet:
      id: 013-seed-glossary-more
      author: oozengine
      changes:
        - insert: {tableName: glossary_entries, columns: [{column: {name: id, value: "6105a000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Action"}}, {column: {name: description, value: "The main thing you do on your turn — such as Attack, Dash, Dodge, Disengage, Help, Hide, Magic, Ready, Search, or Utilize. You get one per turn."}}]}
        - insert: {tableName: glossary_entries, columns: [{column: {name: id, value: "6105a000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Bonus Action"}}, {column: {name: description, value: "An extra, faster action that certain features let you take on your turn in addition to your action. You can take at most one per turn."}}]}
        - insert: {tableName: glossary_entries, columns: [{column: {name: id, value: "6105a000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Reaction"}}, {column: {name: description, value: "An instant response triggered by a specific event, usable once per round even when it isn't your turn."}}]}
