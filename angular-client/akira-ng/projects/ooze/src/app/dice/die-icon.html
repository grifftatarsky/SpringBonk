<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5.5"
     stroke-linejoin="round" stroke-linecap="round" class="size-full" aria-hidden="true">
  @switch (die()) {
    @case (4) {
      <polygon points="50,12 90,84 10,84" />
      <path d="M50,12 L50,60 M10,84 L50,60 M90,84 L50,60" />
    }
    @case (6) {
      <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" />
      <path d="M50,50 L50,6 M50,50 L88,72 M50,50 L12,72" />
    }
    @case (8) {
      <polygon points="50,8 84,50 50,92 16,50" />
      <path d="M16,50 L50,66 L84,50 M50,8 L50,66" />
    }
    @case (12) {
      <polygon points="50,6 90,35 75,84 25,84 10,35" />
      <polygon points="50,30 70,44 62,69 38,69 30,44" />
      <path d="M50,6 L50,30 M90,35 L70,44 M75,84 L62,69 M25,84 L38,69 M10,35 L30,44" />
    }
    @case (20) {
      <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" />
      <polygon points="50,30 74,70 26,70" />
      <path
        d="M50,30 L50,5 M50,30 L11,27 M50,30 L89,27 M74,70 L89,27 M74,70 L89,73 M74,70 L50,95 M26,70 L11,27 M26,70 L11,73 M26,70 L50,95"
      />
    }
    @default {
      <!-- d10 / d100 -->
      <polygon points="50,6 82,36 72,64 50,94 28,64 18,36" />
      <path d="M18,36 L50,50 L82,36 M50,6 L50,50 M28,64 L50,50 M72,64 L50,50 M50,50 L50,94" />
    }
  }
</svg>
