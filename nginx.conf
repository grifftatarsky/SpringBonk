worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # The v6 worker chunk alone is 490kB uncompressed. text/html is always
    # compressed and must not be listed — nginx warns about the duplicate.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        image/svg+xml
        text/plain;

    include       mime.types;
    default_type  application/octet-stream;

    # nginx's shipped mime.types predates .mjs and maps it to
    # application/octet-stream, which a module script is required to refuse.
    # MapLibre v6 loads its tile-parsing worker as maplibre-gl-worker.mjs, so
    # without this the worker dies on import with no error and the globe renders
    # with no tiles at all.
    types {
        application/javascript  mjs;
    }

    # WebSocket upgrade plumbing for the Decks STOMP endpoint.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7080;
        server_name localhost;

        # Sticker photos post through /bff to jpss-resource, which accepts 8MB
        # files. nginx's own default is 1m, and it rejects the upload with a 413
        # before the BFF ever sees it — so this has to be at least as large as
        # the service's own cap, plus room for the multipart envelope.
        client_max_body_size 12m;

        # Keycloak
        location /auth/ {
            proxy_pass http://host.docker.internal:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # BFF
        location /bff/ {
            rewrite ^/bff/(.*) /$1 break;
            proxy_pass http://host.docker.internal:7081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Decks STOMP/WebSocket — direct to spring-decks (auth is via the
        # one-time ticket in the STOMP CONNECT frame, not the BFF session), with
        # the upgrade headers WebSockets need. /dck-ws/ws -> spring-decks /ws.
        location /dck-ws/ {
            proxy_pass http://host.docker.internal:7086/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /remotes/ooze/ {
          alias /usr/share/nginx/dist/ooze/browser/;
          add_header Cache-Control "no-cache";
        }

        location /remotes/president/ {
          alias /usr/share/nginx/dist/president/browser/;
          add_header Cache-Control "no-cache";
        }

        location /remotes/jpss-ui/ {
          alias /usr/share/nginx/dist/jpss-ui/browser/;
          add_header Cache-Control "no-cache";
        }

        # Angular
        location / {
          root /usr/share/nginx/dist/akira-ng/browser;
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache";
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }
}