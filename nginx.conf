worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 7080;
        server_name localhost;

        # Keycloak
        location /auth/ {
            proxy_pass http://host.docker.internal:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # BFF
        location /bff/ {
            rewrite ^/bff/(.*) /$1 break;
            proxy_pass http://host.docker.internal:7081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ooze federated micro-frontend — built static bundle, served
        # same-origin (no CORS) under a path that does NOT collide with the
        # shell's client-side /ooze route. The shell's federation manifest
        # points here; Native Federation resolves the remote's chunks relative
        # to remoteEntry.json.
        location /remotes/ooze/ {
          alias /usr/share/nginx/dist/ooze/browser/;
          add_header Cache-Control "no-cache";
        }

        # Angular
        location / {
          root /usr/share/nginx/dist/akira-ng/browser;
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache";
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }
}