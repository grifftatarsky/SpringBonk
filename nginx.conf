worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade plumbing for the Decks STOMP endpoint.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7080;
        server_name localhost;

        # Keycloak
        location /auth/ {
            proxy_pass http://host.docker.internal:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # BFF
        location /bff/ {
            rewrite ^/bff/(.*) /$1 break;
            proxy_pass http://host.docker.internal:7081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Decks STOMP/WebSocket — direct to spring-decks (auth is via the
        # one-time ticket in the STOMP CONNECT frame, not the BFF session), with
        # the upgrade headers WebSockets need. /dck-ws/ws -> spring-decks /ws.
        location /dck-ws/ {
            proxy_pass http://host.docker.internal:7086/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /remotes/ooze/ {
          alias /usr/share/nginx/dist/ooze/browser/;
          add_header Cache-Control "no-cache";
        }

        location /remotes/president/ {
          alias /usr/share/nginx/dist/president/browser/;
          add_header Cache-Control "no-cache";
        }

        # Angular
        location / {
          root /usr/share/nginx/dist/akira-ng/browser;
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache";
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }
}