name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published queries run against unchanged code.
    - cron: '31 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main/scheduled run: it would drop the uploaded results.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Maven multi-module backend; needs a real compile for accurate dataflow.
          - language: java-kotlin
            build-mode: manual
          # angular-client/akira-ng; dist/, node_modules/ and .angular/ are
          # gitignored, so a fresh checkout contains sources only.
          - language: javascript-typescript
            build-mode: none
          # Lints these workflow files themselves.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default suite = curated, low-noise security queries. To widen later:
          #   queries: security-extended        # more security queries, more FPs
          #   queries: security-and-quality     # the above plus lint/maintainability

      - name: Build Java modules
        if: matrix.build-mode == 'manual'
        run: ./mvnw -B -ntp compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
