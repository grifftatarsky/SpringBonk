name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published queries run against unchanged code.
    - cron: '31 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main/scheduled run: it would drop the uploaded results.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Maven multi-module backend; needs a real compile for accurate dataflow.
          # Uses its own config because `threat-models` is Java/C#-only.
          - language: java-kotlin
            build-mode: manual
            config: ./.github/codeql/codeql-config-java.yml
          # angular-client/akira-ng; dist/, node_modules/ and .angular/ are
          # gitignored, so a fresh checkout contains sources only.
          - language: javascript-typescript
            build-mode: none
            config: ./.github/codeql/codeql-config.yml
          # Lints these workflow files themselves.
          - language: actions
            build-mode: none
            config: ./.github/codeql/codeql-config.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Query suite and threat model live in the config file so they are
          # reviewable next to the reasoning for them.
          config-file: ${{ matrix.config }}

      - name: Build Java modules
        if: matrix.build-mode == 'manual'
        run: ./mvnw -B -ntp compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
